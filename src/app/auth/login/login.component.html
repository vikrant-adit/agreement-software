<div class="container">
  <div class="login-container">
    <img src="https://demo.enfolytics.com/assets/images/adit-logo.png" alt="Company Logo" class="logo">

    <form [formGroup]="loginForm" (ngSubmit)="login()">

      <!-- Username Field -->
      <div class="form-group">
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>Username</mat-label>
          <input
            matInput
            formControlName="email"
            placeholder="Enter Username"
            id="username"
            name="username"
            type="text"
            required
          />
        </mat-form-field>

        <!-- Validation Message -->
        <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Username is required.
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <mat-form-field class="full-width" appearance="fill">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hide() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            required
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="clickEvent($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide()"
          >
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <!-- Validation Message -->
        <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </div>
      </div>

      <!-- Submit Button -->
      <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>
  </div>
</div>

<!-- Loader -->
<div class="loader-overlay" *ngIf="loading">
  <div class="loader"></div>
</div>
